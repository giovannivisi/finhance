name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: input
    id: summary
    attributes:
      label: What do you want?
      placeholder: A short description of the feature.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem it solves
      placeholder: What's the current friction? Why does this matter?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: How should it work? Describe the behaviour from the user's perspective.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Other approaches you thought about and why you ruled them out.
    validations:
      required: false
