name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: input
    id: summary
    attributes:
      label: What happened?
      placeholder: A short, clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to…
        2. Click…
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, error messages, environment details.
    validations:
      required: false
