name: Render keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions: {}

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping Render health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate configuration
        env:
          RENDER_KEEPALIVE_URL: ${{ vars.RENDER_KEEPALIVE_URL }}
        run: |
          if [ -z "${RENDER_KEEPALIVE_URL}" ]; then
            echo "Repository variable RENDER_KEEPALIVE_URL is not set."
            exit 1
          fi

      - name: Curl Render service
        env:
          RENDER_KEEPALIVE_URL: ${{ vars.RENDER_KEEPALIVE_URL }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            "${RENDER_KEEPALIVE_URL}"
