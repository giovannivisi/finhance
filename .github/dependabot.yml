version: 2
updates:
  # The root pnpm-lock.yaml covers every workspace package, including the
  # exact-pinned next-auth beta in apps/web, which only receives security
  # fixes through manual-style bumps like these.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      production-patches:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "patch"
      development-patches:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "patch"
    # Expo SDK upgrades must be applied as a compatible set with `expo install`.
    # React Native versions are also constrained by the selected SDK.
    ignore:
      - dependency-name: "expo"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "expo-*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@expo/*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-native-*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "@react-native*/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
