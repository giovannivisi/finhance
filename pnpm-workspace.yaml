allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  sharp: true
  unrs-resolver: true

# Metro only processes repository-controlled image assets during development
# and builds. Both advisories require image-size 2.0.3, which is not published
# on npm as of 2026-08-17; remove these ignores once a patched release exists.
auditConfig:
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.27"
  - "@expo/router-server@57.0.11"
  - babel-preset-expo@57.0.13
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo@57.0.25
  - "@expo/ui@57.0.20"
  - expo-glass-effect@57.0.4
  - expo-image-picker@57.0.20
  - expo-linking@57.0.11
  - expo-router@57.0.23
  - expo-build-properties@57.0.22

patchedDependencies:
  "@expo/plist@0.8.1": patches/@expo__plist@0.8.1.patch
  "query-string@7.1.3": patches/query-string@7.1.3.patch
