repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write
        language: system
        files: '\.(ts|tsx|mts|cts|js|jsx|mjs|cjs|json|md|ya?ml)$'

      - id: prisma-format
        name: prisma format
        entry: pnpm --filter api exec prisma format --schema prisma/schema.prisma
        language: system
        pass_filenames: false
        files: '^apps/api/prisma/schema\.prisma$'

      - id: api-lint
        name: api lint
        entry: pnpm --filter api lint
        language: system
        pass_filenames: false
        files: '^apps/api/.*\.ts$'

      - id: api-tests
        name: api unit tests
        entry: pnpm --filter api test -- --runInBand
        language: system
        pass_filenames: false
        files: '^(apps/api/|packages/shared/).*\.(ts|js|json|mjs|prisma|sql)$'

      - id: web-lint
        name: web lint
        entry: pnpm --filter web lint
        language: system
        pass_filenames: false
        files: '^apps/web/.*\.(ts|tsx|mts|cts|js|jsx|mjs)$'

      - id: web-tests
        name: web tests
        entry: pnpm --filter web test
        language: system
        pass_filenames: false
        files: '^(apps/web/|packages/shared/).*\.(ts|tsx|mts|cts|js|jsx|mjs|json)$'

      - id: check-migration
        name: migration safety check
        entry: python3 scripts/check-migration.py
        language: system
        files: '^packages/db/prisma/migrations/.*\.sql$'

      - id: no-raw-prisma
        name: no $queryRaw (use typed Prisma methods)
        language: pygrep
        entry: '\$queryRaw'
        files: '^apps/api/.*\.ts$'
        exclude: '\.spec\.ts$'

      - id: no-plain-error-in-services
        name: no plain Error in services (use NestJS exceptions)
        language: pygrep
        entry: 'throw new Error\('
        files: '^apps/api/src/.*\.service\.ts$'
        exclude: '\.spec\.ts$'

      - id: commit-msg-prefix
        name: commit message prefix
        language: system
        entry: >-
          bash -c 'msg=$(cat "$1");
          echo "$msg" | grep -qE "^(feat|fix|perf|refactor|chore|docs|test|ci|style)(\(.+\))?: .+"
          || { echo "❌  Commit message must start with a prefix:";
               echo "    feat|fix|perf|refactor|chore|docs|test|ci|style";
               echo "    Example: fix: correct fx rate rounding";
               exit 1; };
          echo "$msg" | grep -qE "^(feat|fix|perf|refactor|chore|docs|test|ci|style)\((feat|fix|perf|refactor|chore|docs|test|ci|style)\):"
          && { echo "❌  The scope must not be a reserved prefix word.";
               echo "    e.g. feat(docs): is wrong — a docs change is just docs:";
               echo "    If the change is documentation, use docs: not feat(docs):";
               exit 1; } || true' --
        stages: [commit-msg]
